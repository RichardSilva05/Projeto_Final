<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel - Sabino Gesso</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    >


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="../css adm/painel.css"
    >


    <script src="../js adm/sair.js"></script>

</head>


<body>


    <!-- =====================================================
         LAYOUT
    ====================================================== -->

    <div class="layout">


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">


            <!-- LOGO -->

            <div class="sidebar-logo">

                <img
                    src="../img/logo.png"
                    alt="Logo Sabino Gesso"
                >

            </div>


            <!-- MENU -->

            <nav>

                <ul>


                    <!-- VISÃO GERAL -->

                    <li>

                        <a
                            href="painel.html"
                            class="ativo"
                        >

                            <i class="bi bi-house"></i>

                            <span>
                                Visão Geral
                            </span>

                        </a>

                    </li>


                    <!-- ORÇAMENTOS -->

                    <li>

                        <a href="orcamentos.html">

                            <i class="bi bi-receipt"></i>

                            <span>
                                Orçamentos
                            </span>

                        </a>

                    </li>


                    <!-- CLIENTES -->

                    <li>

                        <a href="clientes.html">

                            <i class="bi bi-people"></i>

                            <span>
                                Clientes
                            </span>

                        </a>

                    </li>


                    <!-- RELATÓRIOS -->

                    <li>

                        <a href="relatorios.html">

                            <i class="bi bi-bar-chart-line"></i>

                            <span>
                                Relatórios
                            </span>

                        </a>

                    </li>


                    <!-- PROJETOS -->

                    <li>

                        <a href="projetos.html">

                            <i class="bi bi-kanban"></i>

                            <span>
                                Projetos
                            </span>

                        </a>

                    </li>


                    <!-- CONFIGURAÇÕES -->

                    <li>

                        <a href="configuracoes.html">

                            <i class="bi bi-gear"></i>

                            <span>
                                Configurações
                            </span>

                        </a>

                    </li>


                    <!-- SAIR -->

                    <li class="menu-sair">

                        <a
                            href="login.html"
                            onclick="return confirmarSaida()"
                        >

                            <i class="bi bi-box-arrow-right"></i>

                            <span>
                                Sair
                            </span>

                        </a>

                    </li>


                </ul>

            </nav>

        </aside>



        <!-- =================================================
             CONTEÚDO
        ================================================== -->

        <main class="content">


            <!-- =================================================
                 CABEÇALHO
            ================================================== -->

            <div class="cabecalho">

                <h1>
                    Visão Geral
                </h1>

            </div>



            <!-- =================================================
                 CARDS
            ================================================== -->

            <section class="cards-resumo">


                <!-- TOTAL DE ORÇAMENTOS -->

                <div class="card-resumo">

                    <h2>
                        Total de Orçamentos
                    </h2>

                    <p id="totalOrcamentos">
                        0
                    </p>

                </div>


                <!-- NOVOS CLIENTES -->

                <div class="card-resumo">

                    <h2>
                        Novos Clientes
                    </h2>

                    <p id="novosClientes">
                        0
                    </p>

                </div>


                <!-- RECEITA MENSAL -->

                <div class="card-resumo">

                    <h2>
                        Receita Mensal
                    </h2>

                    <p id="receitaMensal">
                        R$ 0,00
                    </p>

                </div>


            </section>



            <!-- =================================================
                 TABELA DE CLIENTES
            ================================================== -->

            <section class="card-painel">


                <h2>
                    Clientes
                </h2>


                <div class="table-responsive">


                    <table>


                        <thead>

                            <tr>

                                <th>
                                    Nome
                                </th>

                                <th>
                                    Email
                                </th>

                                <th>
                                    Telefone
                                </th>

                                <th>
                                    Status
                                </th>

                            </tr>

                        </thead>


                        <tbody id="tabelaClientes">

                            <!--
                                Os clientes serão carregados
                                diretamente do banco através
                                da API.
                            -->

                            <tr>

                                <td colspan="4">
                                    Carregando clientes...
                                </td>

                            </tr>

                        </tbody>


                    </table>


                </div>

            </section>


        </main>


    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="../js adm/painel.js"></script>


</body>

</html>
