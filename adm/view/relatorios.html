<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Relatórios - Painel - Sabino Gesso</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    >

    <link
        rel="stylesheet"
        href="../css/relatorios.css"
    >

    <script src="../js/sair.js"></script>

</head>


<body>


    <!-- =====================================================
         LAYOUT
    ====================================================== -->

    <div class="layout">


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">

            <div class="sidebar-logo">

                <img
                    src="../img/logo.png"
                    alt="Logo Sabino Gesso"
                >

            </div>


            <nav>

                <ul>

                    <li>

                        <a href="painel.html">

                            <i class="bi bi-house"></i>

                            <span>
                                Visão Geral
                            </span>

                        </a>

                    </li>


                    <li>

                        <a href="orcamentos.html">

                            <i class="bi bi-receipt"></i>

                            <span>
                                Orçamentos
                            </span>

                        </a>

                    </li>


                    <li>

                        <a href="clientes.html">

                            <i class="bi bi-people"></i>

                            <span>
                                Clientes
                            </span>

                        </a>

                    </li>


                    <li>

                        <a
                            href="relatorios.html"
                            class="ativo"
                        >

                            <i class="bi bi-bar-chart-line"></i>

                            <span>
                                Relatórios
                            </span>

                        </a>

                    </li>


                    <li>

                        <a href="projetos.html">

                            <i class="bi bi-kanban"></i>

                            <span>
                                Projetos
                            </span>

                        </a>

                    </li>


                    <li>

                        <a href="configuracoes.html">

                            <i class="bi bi-gear"></i>

                            <span>
                                Configurações
                            </span>

                        </a>

                    </li>


                    <li class="menu-sair">

                        <a
                            href="login.html"
                            onclick="return confirmarSaida()"
                        >

                            <i class="bi bi-box-arrow-right"></i>

                            <span>
                                Sair
                            </span>

                        </a>

                    </li>

                </ul>

            </nav>

        </aside>



        <!-- =================================================
             CONTEÚDO
        ================================================== -->

        <main class="content">


            <div class="cabecalho">

                <h1>
                    Relatórios
                </h1>

            </div>



            <!-- =================================================
                 RELATÓRIOS PRINCIPAIS
            ================================================== -->

            <section class="relatorios-grid">


                <!-- =================================================
                     RECEITA MENSAL
                ================================================== -->

                <div class="card-relatorio receita-card">

                    <h2>
                        Receita Mensal
                    </h2>


                    <div class="grafico-receita">


                        <div
                            class="eixo-y"
                            id="eixoY"
                        >

                            <!-- preenchido pelo JS -->

                        </div>


                        <div class="grafico-area">


                            <div class="linhas-grafico">

                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>

                            </div>


                            <div
                                class="barras"
                                id="barrasReceita"
                            >

                                <div class="carregando-relatorio">

                                    <i class="bi bi-arrow-repeat"></i>

                                    Carregando...

                                </div>

                            </div>


                        </div>

                    </div>

                </div>



                <!-- =================================================
                     TIPOS DE SERVIÇOS
                ================================================== -->

                <div class="card-relatorio servicos-card">

                    <h2>
                        Tipos de Serviços
                    </h2>


                    <div class="grafico-pizza">

                        <div
                            class="pizza"
                            id="graficoPizza"
                        >

                            <div class="pizza-centro">

                                <strong id="percentualPrincipal">
                                    0%
                                </strong>

                                <span id="servicoPrincipal">
                                    Carregando...
                                </span>

                            </div>

                        </div>

                    </div>


                    <div
                        class="legenda"
                        id="legendaServicos"
                    >

                        <div class="carregando-relatorio">

                            <i class="bi bi-arrow-repeat"></i>

                            Carregando...

                        </div>

                    </div>

                </div>


            </section>



            <!-- =================================================
                 MELHORES DESEMPENHOS
            ================================================== -->

            <section class="card-desempenho">


                <h2>
                    Meses de Melhor Desempenho
                </h2>


                <div
                    class="ranking"
                    id="rankingDesempenho"
                >

                    <div class="carregando-relatorio">

                        <i class="bi bi-arrow-repeat"></i>

                        Carregando...

                    </div>

                </div>


            </section>


        </main>


    </div>


    <script src="../js/relatorios.js"></script>

</body>

</html>
