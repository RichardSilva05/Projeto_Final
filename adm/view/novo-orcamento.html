<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novo Orçamento - Painel - Sabino Gesso</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/novo-orcamento.css">
<script src="../js/sair.js"></script>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="sidebar-logo"><img src="../img/logo.png" alt="Logo Sabino Gesso"></div>
<nav><ul>
<li><a href="painel.html"><i class="bi bi-house"></i><span>Visão Geral</span></a></li>
<li><a href="orcamentos.html" class="ativo"><i class="bi bi-receipt"></i><span>Orçamentos</span></a></li>
<li><a href="clientes.html"><i class="bi bi-people"></i><span>Clientes</span></a></li>
<li><a href="relatorios.html"><i class="bi bi-bar-chart-line"></i><span>Relatórios</span></a></li>
<li><a href="projetos.html"><i class="bi bi-kanban"></i><span>Projetos</span></a></li>
<li><a href="configuracoes.html"><i class="bi bi-gear"></i><span>Configurações</span></a></li>
<li class="menu-sair"><a href="login.html" onclick="return confirmarSaida()"><i class="bi bi-box-arrow-right"></i><span>Sair</span></a></li>
</ul></nav>
</aside>

<main class="content">
<div class="cabecalho">
<div>
<h1>Novo Orçamento</h1>
<p>Selecione um cliente cadastrado e informe apenas os dados deste orçamento.</p>
</div>
<a href="orcamentos.html" class="btn-voltar"><i class="bi bi-arrow-left"></i> Voltar</a>
</div>

<section class="card-orcamento">
<h2>Cliente</h2>
<div class="busca-cliente">
<div class="campo">
<label for="codigoCliente">Código do Cliente</label>
<input type="text" id="codigoCliente" placeholder="Ex.: CLI-0001" autocomplete="off">
</div>
<button type="button" class="btn-buscar" id="btnBuscarCliente"><i class="bi bi-search"></i> Buscar Cliente</button>
<a href="novo-cliente.html" class="btn-novo-cliente"><i class="bi bi-person-plus"></i> Novo Cliente</a>
</div>

<p id="mensagemCliente" class="mensagem-cliente"></p>

<div id="dadosCliente" class="dados-cliente" hidden>
<div class="cliente-identificacao">
<span class="cliente-codigo" id="codigoClienteEncontrado"></span>
<strong id="clienteNome"></strong>
</div>

<div class="form-grid">
<div class="campo"><label>CPF/CNPJ</label><input type="text" id="clienteDocumento" readonly></div>
<div class="campo"><label>Telefone</label><input type="text" id="clienteTelefone" readonly></div>
<div class="campo campo-grande"><label>E-mail</label><input type="text" id="clienteEmail" readonly></div>
<div class="campo"><label>CEP</label><input type="text" id="clienteCep" readonly></div>
<div class="campo"><label>Estado</label><input type="text" id="clienteEstado" readonly></div>
<div class="campo campo-grande"><label>Cidade</label><input type="text" id="clienteCidade" readonly></div>
<div class="campo"><label>Bairro</label><input type="text" id="clienteBairro" readonly></div>
<div class="campo campo-grande"><label>Logradouro</label><input type="text" id="clienteLogradouro" readonly></div>
<div class="campo"><label>Número</label><input type="text" id="clienteNumero" readonly></div>
<div class="campo campo-grande"><label>Complemento</label><input type="text" id="clienteComplemento" readonly></div>
</div>
</div>
</section>

<section class="card-orcamento">
<h2>Dados do Serviço</h2>
<div class="form-grid">
<div class="campo campo-grande">
<label for="servico">Serviço</label>
<select id="servico" required>
<option value="">Selecione o serviço</option>
<option value="sanca">Sanca</option>
<option value="forro">Forro Rebaixado</option>
<option value="moldura">Moldura Decorativa</option>
<option value="divisoria">Divisória</option>
<option value="outro">Outro</option>
</select>
</div>
<div class="campo"><label for="area">Área aproximada (m²)</label><input type="number" id="area" min="1" placeholder="Ex.: 50" required></div>
<div class="campo campo-grande">
<label for="prazo">Prazo desejado</label>
<select id="prazo" required>
<option value="">Selecione o prazo</option>
<option value="urgente">Urgente</option>
<option value="30">Até 30 dias</option>
<option value="sem-pressa">Sem pressa</option>
</select>
</div>
</div>
</section>

<section class="card-orcamento">
<h2>Endereço do Serviço</h2>
<label class="checkbox-endereco"><input type="checkbox" id="usarEnderecoCliente" checked> Usar o endereço cadastrado do cliente</label>
<div class="form-grid">
<div class="campo"><label for="cep">CEP</label><input type="text" id="cep" placeholder="00000-000" required></div>
<div class="campo"><label for="estado">Estado</label><input type="text" id="estado" placeholder="Ex.: SC" required></div>
<div class="campo campo-grande"><label for="cidade">Cidade</label><input type="text" id="cidade" placeholder="Digite a cidade" required></div>
<div class="campo"><label for="bairro">Bairro</label><input type="text" id="bairro" placeholder="Digite o bairro" required></div>
<div class="campo campo-grande"><label for="logradouro">Logradouro</label><input type="text" id="logradouro" placeholder="Rua, avenida..." required></div>
<div class="campo"><label for="numero">Número</label><input type="text" id="numero" placeholder="Nº" required></div>
<div class="campo campo-grande"><label for="complemento">Complemento</label><input type="text" id="complemento" placeholder="Apartamento, bloco, referência..."></div>
</div>
</section>

<section class="card-orcamento">
<h2>Observações</h2>
<div class="campo">
<label for="observacoes">Informações adicionais</label>
<textarea id="observacoes" rows="4" placeholder="Digite alguma informação adicional sobre o orçamento..."></textarea>
</div>
</section>

<div class="acoes">
<a href="orcamentos.html" class="btn-cancelar">Cancelar</a>
<button type="button" class="btn-salvar" id="btnSalvarOrcamento"><i class="bi bi-check-lg"></i> Salvar Orçamento</button>
</div>
</main>
</div>
<script src="../js/novo-orcamento.js"></script>
</body>
</html>
