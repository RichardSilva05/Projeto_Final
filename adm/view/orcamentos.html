<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orçamentos - Painel - Sabino Gesso</title>

    <meta name="robots" content="noindex, nofollow">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    >

    <link rel="stylesheet" href="../css/orcamentos.css">

    <script src="../js/sair.js"></script>
</head>

<body>

    <div class="layout">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <div class="sidebar-logo">
                <img
                    src="../img/logo.png"
                    alt="Logo Sabino Gesso"
                >
            </div>

            <nav>

                <ul>

                    <li>
                        <a href="painel.html">
                            <i class="bi bi-house"></i>
                            <span>Visão Geral</span>
                        </a>
                    </li>

                    <li>
                        <a href="orcamentos.html" class="ativo">
                            <i class="bi bi-receipt"></i>
                            <span>Orçamentos</span>
                        </a>
                    </li>

                    <li>
                        <a href="clientes.html">
                            <i class="bi bi-people"></i>
                            <span>Clientes</span>
                        </a>
                    </li>

                    <li>
                        <a href="relatorios.html">
                            <i class="bi bi-bar-chart-line"></i>
                            <span>Relatórios</span>
                        </a>
                    </li>

                    <li>
                        <a href="projetos.html">
                            <i class="bi bi-kanban"></i>
                            <span>Projetos</span>
                        </a>
                    </li>

                    <li>
                        <a href="configuracoes.html">
                            <i class="bi bi-gear"></i>
                            <span>Configurações</span>
                        </a>
                    </li>

                    <li class="menu-sair">
                        <a
                            href="login.html"
                            onclick="return confirmarSaida()"
                        >
                            <i class="bi bi-box-arrow-right"></i>
                            <span>Sair</span>
                        </a>
                    </li>

                </ul>

            </nav>

        </aside>


        <!-- ================= CONTEÚDO ================= -->

        <main class="content">

            <div class="cabecalho">

                <h1>Orçamentos</h1>

                <a
                    href="novo-orcamento.html"
                    class="btn-novo-orcamento"
                    id="btnNovoOrcamento"
                >
                    <i class="bi bi-file-earmark-plus"></i>
                    Novo Orçamento
                </a>

            </div>


            <section class="card-orcamentos">

                <h2>Orçamentos cadastrados</h2>


                <div class="table-responsive">

                    <table id="tabelaOrcamentos">

                        <thead>

                            <tr>

                                <th>
                                    Cliente
                                </th>

                                <th>
                                    Código
                                </th>

                                <th
                                    class="th-ordenavel"
                                    id="colunaData"
                                >
                                    Data

                                    <i class="bi bi-caret-down-fill"></i>
                                </th>

                                <th>
                                    Valor
                                </th>

                                <th>
                                    Status
                                </th>

                                <th></th>

                            </tr>

                        </thead>


                        <tbody id="corpoOrcamentos">

                            <tr>

                                <td
                                    colspan="6"
                                    class="carregando"
                                >
                                    <i class="bi bi-arrow-repeat"></i>
                                    Carregando orçamentos...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <script src="../js/orcamentos.js"></script>

</body>

</html>
