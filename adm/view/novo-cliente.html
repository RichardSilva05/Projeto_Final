<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Novo Cliente - Sabino Gesso</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    >

    <link
        rel="stylesheet"
        href="../css/novo-cliente.css"
    >

    <script src="../js/sair.js"></script>

</head>

<body>

    <div class="layout">

        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">

            <div class="sidebar-logo">

                <img
                    src="../img/logo.png"
                    alt="Logo Sabino Gesso"
                >

            </div>


            <nav>

                <ul>

                    <li>
                        <a href="painel.html">
                            <i class="bi bi-house"></i>
                            <span>Visão Geral</span>
                        </a>
                    </li>


                    <li>
                        <a href="orcamentos.html">
                            <i class="bi bi-receipt"></i>
                            <span>Orçamentos</span>
                        </a>
                    </li>


                    <li>
                        <a
                            href="clientes.html"
                            class="ativo"
                        >
                            <i class="bi bi-people"></i>
                            <span>Clientes</span>
                        </a>
                    </li>


                    <li>
                        <a href="relatorios.html">
                            <i class="bi bi-bar-chart-line"></i>
                            <span>Relatórios</span>
                        </a>
                    </li>


                    <li>
                        <a href="projetos.html">
                            <i class="bi bi-kanban"></i>
                            <span>Projetos</span>
                        </a>
                    </li>


                    <li>
                        <a href="configuracoes.html">
                            <i class="bi bi-gear"></i>
                            <span>Configurações</span>
                        </a>
                    </li>


                    <li class="menu-sair">

                        <a
                            href="login.html"
                            onclick="return confirmarSaida()"
                        >

                            <i class="bi bi-box-arrow-right"></i>

                            <span>
                                Sair
                            </span>

                        </a>

                    </li>

                </ul>

            </nav>

        </aside>


        <!-- =================================================
             CONTEÚDO
        ================================================== -->

        <main class="content">


            <!-- CABEÇALHO -->

            <div class="cabecalho">

                <div>

                    <h1>
                        Novo Cliente
                    </h1>

                    <p>
                        Cadastre as informações do cliente.
                    </p>

                </div>


                <a
                    href="clientes.html"
                    class="btn-voltar"
                >

                    <i class="bi bi-arrow-left"></i>

                    Voltar

                </a>

            </div>



            <!-- =================================================
                 DADOS DO CLIENTE
            ================================================== -->

            <section class="card-cliente">

                <h2>
                    Dados do Cliente
                </h2>


                <div class="form-grid">


                    <!-- TIPO -->

                    <div class="campo">

                        <label for="tipoCliente">
                            Tipo de Cliente
                        </label>

                        <select
                            id="tipoCliente"
                            name="tipoCliente"
                            required
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option value="pf">
                                Pessoa Física
                            </option>

                            <option value="pj">
                                Pessoa Jurídica
                            </option>

                        </select>

                    </div>


                    <!-- NOME -->

                    <div class="campo campo-grande">

                        <label for="nome">
                            Nome Completo / Razão Social
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite o nome do cliente"
                            required
                        >

                    </div>


                    <!-- CPF / CNPJ -->

                    <div class="campo">

                        <label
                            for="documento"
                            id="labelDocumento"
                        >
                            CPF
                        </label>

                        <input
                            type="text"
                            id="documento"
                            name="documento"
                            placeholder="000.000.000-00"
                            maxlength="18"
                            required
                        >

                    </div>


                    <!-- TELEFONE -->

                    <div class="campo">

                        <label for="telefone">
                            Telefone
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(00) 00000-0000"
                            required
                        >

                    </div>


                    <!-- E-MAIL -->

                    <div class="campo campo-grande">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="cliente@email.com"
                            required
                        >

                    </div>

                </div>

            </section>



            <!-- =================================================
                 ENDEREÇO
            ================================================== -->

            <section class="card-cliente">

                <h2>
                    Endereço
                </h2>


                <div class="form-grid">


                    <div class="campo">

                        <label for="cep">
                            CEP
                        </label>

                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            placeholder="00000-000"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="estado">
                            Estado
                        </label>

                        <input
                            type="text"
                            id="estado"
                            name="estado"
                            placeholder="Ex.: SC"
                            required
                        >

                    </div>


                    <div class="campo campo-grande">

                        <label for="cidade">
                            Cidade
                        </label>

                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            placeholder="Digite a cidade"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="bairro">
                            Bairro
                        </label>

                        <input
                            type="text"
                            id="bairro"
                            name="bairro"
                            placeholder="Digite o bairro"
                            required
                        >

                    </div>


                    <div class="campo campo-grande">

                        <label for="logradouro">
                            Logradouro
                        </label>

                        <input
                            type="text"
                            id="logradouro"
                            name="logradouro"
                            placeholder="Rua, avenida..."
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="numero">
                            Número
                        </label>

                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            placeholder="Nº"
                            required
                        >

                    </div>


                    <div class="campo campo-grande">

                        <label for="complemento">
                            Complemento
                        </label>

                        <input
                            type="text"
                            id="complemento"
                            name="complemento"
                            placeholder="Apartamento, bloco, referência..."
                        >

                    </div>

                </div>

            </section>



            <!-- =================================================
                 OBSERVAÇÕES
            ================================================== -->

            <section class="card-cliente">

                <h2>
                    Observações
                </h2>


                <div class="campo">

                    <label for="observacoes">
                        Informações adicionais
                    </label>

                    <textarea
                        id="observacoes"
                        name="observacoes"
                        rows="4"
                        placeholder="Digite alguma informação adicional..."
                    ></textarea>

                </div>

            </section>



            <!-- =================================================
                 AÇÕES
            ================================================== -->

            <div class="acoes">

                <a
                    href="clientes.html"
                    class="btn-cancelar"
                >
                    Cancelar
                </a>


                <button
                    type="button"
                    class="btn-salvar"
                    id="btnSalvarCliente"
                >

                    <i class="bi bi-check-lg"></i>

                    Salvar Cliente

                </button>

            </div>


        </main>

    </div>


    <script src="../js/novo-cliente.js"></script>

</body>

</html>
