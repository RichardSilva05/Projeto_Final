<!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Administrador - Sabino Gesso</title>
        <meta name="robots" content="noindex, nofollow">

        <!-- Não envia a URL da página a outros sites -->
        <meta name="referrer" content="no-referrer">

        <link rel="stylesheet" href="../css adm/login.css">
    </head>
    <body>

        <section class="login-card">

            <img src="../img adm/logo.png" alt="Logo Sabino Gesso" class="login-logo">

            <h1>Login de Administrador</h1>

            <!--
                method="post": se o JavaScript não carregar, o navegador NÃO
                coloca e-mail e senha na barra de endereço (o padrão, GET,
                colocaria: login.html?email=...&senha=...).
            -->
            <form id="formLogin" method="post" action="#" novalidate>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn-entrar">Entrar</button>

            </form>

        </section>

        <script src="/public/js/login.js"></script>

    </body>
    </html>
